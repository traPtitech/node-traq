name: check npm ci & build

on:
  push:
    branches:
      - "master"
  pull_request:

jobs:
  check:
    name: check npm ci & build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: check npm ci
        run: npm ci
      - name: check npm build
        run: npm run build
      - name: check type
        run: npm run type-check
      - name: check npm diff
        id: diff
        if: github.event_name == 'pull_request'
        run: |
          npm diff ./dist > dist.diff
          if [ -s dist.diff ]; then
            echo "DIFF=true" >> "$GITHUB_OUTPUT"
          fi
      - name: upload npm diff
        id: diff-artifact
        if: steps.diff.outputs.DIFF == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-diff
          path: dist.diff
          if-no-files-found: error
      - name: comment npm diff
        if: steps.diff.outputs.DIFF == 'true'
        env:
          DIFF_ARTIFACT_URL: ${{ steps.diff-artifact.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node .github/scripts/create-diff-comment.mjs
          gh pr comment -F ./comment.md "$PR_NUMBER"
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
      - name: auto-merge dependabot PR
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch') &&
          steps.diff.outputs.DIFF == ''
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --merge
