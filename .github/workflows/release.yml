name: automatic update

on:
  workflow_dispatch:
    inputs:
      traq_ref:
        description: "traQ branch, tag, or commit to generate from"
        type: string
        default: master
      dist_tag:
        description: "npm dist-tag (use thread or next for a prerelease)"
        type: string
        default: latest
  push:
    branches:
      - master

jobs:
  build:
    name: build release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      traq_ref: ${{ steps.ref.outputs.traq_ref }}
      dist_tag: ${{ steps.ref.outputs.dist_tag }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm CLI version 11.5.1 or later.
      # see: https://docs.npmjs.com/trusted-publishers
      - name: update npm
        run: npm install -g npm@12

      - name: Resolve traQ ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TRAQ_REF: ${{ inputs.traq_ref || 'master' }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
        run: |
          if [[ ! "$INPUT_DIST_TAG" =~ ^[a-z][a-z0-9-]*$ || "$INPUT_DIST_TAG" =~ ^v[0-9] ]]; then
            echo "::error::dist_tag must be a lowercase npm dist-tag, such as thread or next."
            exit 1
          fi
          if [[ "$INPUT_DIST_TAG" == latest && "$INPUT_TRAQ_REF" != master ]]; then
            echo "::error::Use a prerelease dist_tag when generating from a traQ ref other than master."
            exit 1
          fi

          ENCODED_REF=$(node -p 'encodeURIComponent(process.env.INPUT_TRAQ_REF)')
          TRAQ_REF=$(gh api "repos/traPtitech/traQ/commits/$ENCODED_REF" --jq .sha)
          echo "TRAQ_REF=$TRAQ_REF" >> "$GITHUB_ENV"
          echo "DIST_TAG=$INPUT_DIST_TAG" >> "$GITHUB_ENV"
          echo "traq_ref=$TRAQ_REF" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$INPUT_DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: npm ci
        run: npm ci

      - name: build
        run: npm run build

      - name: type-check
        run: npm run type-check

      - name: Check diff
        if: env.DIST_TAG == 'latest'
        run: |
          OLD_SHASUM=$(npm view '@traptitech/traq@latest' dist.shasum)
          NEW_SHASUM=$(npm pack --dry-run --json | jq -er '.[] | .shasum')

          echo "OLD: ${OLD_SHASUM}"
          echo "NEW: ${NEW_SHASUM}"

          if [ "$OLD_SHASUM" = "$NEW_SHASUM" ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
          fi

      - name: Set version name
        if: env.DIST_TAG == 'latest' && env.HAS_DIFF == 'true'
        run: |
          TRAQ_VERSION=$(curl -sS https://api.github.com/repos/traPtitech/traQ/tags | jq -r '.[0].name' | sed -n 's/v//pg')
          echo "TRAQ ${TRAQ_VERSION}"

          VERSION=$(cat ./package.json | jq -r .version | sed -n 's/-/./p')
          echo "PACKAGE ${VERSION}"
          VERSION_ARR=($(echo $VERSION | tr -s '.' ' '))
          VERSION_SHORT=${VERSION_ARR[0]}.${VERSION_ARR[1]}.${VERSION_ARR[2]}
          echo "PACKAGE SHORT ${VERSION_SHORT}"

          if [ $TRAQ_VERSION = $VERSION_SHORT ]; then
            let VERSION_ARR[3]++ 1
            NEW_VERSION="${VERSION_ARR[0]}.${VERSION_ARR[1]}.${VERSION_ARR[2]}-${VERSION_ARR[3]}"
          else
            NEW_VERSION="${TRAQ_VERSION}-0"
          fi
          echo "PACKAGE NEW ${NEW_VERSION}"
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV

      - name: Prepare release package
        id: package
        if: env.DIST_TAG != 'latest' || env.HAS_DIFF == 'true'
        run: |
          if [ "$DIST_TAG" != latest ]; then
            NEW_VERSION="0.0.0-${DIST_TAG}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.g${TRAQ_REF:0:12}"
          fi

          npm version "$NEW_VERSION" --no-git-tag-version --ignore-scripts

          mkdir -p "$RUNNER_TEMP/release"
          TARBALL=$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/release" | jq -er '.[] | .filename')
          mv "$RUNNER_TEMP/release/$TARBALL" "$RUNNER_TEMP/release/package.tgz"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload release package
        if: steps.package.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release/package.tgz
          if-no-files-found: error
          retention-days: 1

  push:
    name: push release version
    needs: build
    if: needs.build.outputs.dist_tag == 'latest' && needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEW_VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Recreate only the version change from a clean checkout. Do not execute
      # dependencies or copy package metadata from the build job into Git.
      - name: Commit release version
        run: |
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Invalid release version."
            exit 1
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          npm version "$NEW_VERSION" --no-git-tag-version --ignore-scripts

          git add package.json package-lock.json
          git commit -m "CI: update to $NEW_VERSION [ci skip]"
          git tag -a "v$NEW_VERSION" -m "CI: update to $NEW_VERSION [ci skip]"

      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::Set RELEASE_DEPLOY_KEY to a write-enabled deploy key allowed to bypass the master ruleset."
            exit 1
          fi

          umask 077
          KEY_FILE=$(mktemp "$RUNNER_TEMP/release-key.XXXXXX")
          KNOWN_HOSTS=$(mktemp "$RUNNER_TEMP/release-known-hosts.XXXXXX")
          trap 'rm -f "$KEY_FILE" "$KNOWN_HOSTS"' EXIT

          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$KEY_FILE"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$KNOWN_HOSTS"

          export GIT_SSH_COMMAND="ssh -i '$KEY_FILE' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$KNOWN_HOSTS'"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

          git push --atomic origin HEAD:refs/heads/master "refs/tags/v$NEW_VERSION"

  publish:
    name: publish release package
    needs: [build, push]
    if: >-
      always() && !cancelled() &&
      needs.build.result == 'success' && needs.build.outputs.version != '' &&
      (needs.build.outputs.dist_tag != 'latest' || needs.push.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DIST_TAG: ${{ needs.build.outputs.dist_tag }}
      NEW_VERSION: ${{ needs.build.outputs.version }}
      TRAQ_REF: ${{ needs.build.outputs.traq_ref }}

    steps:
      - name: Download release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: update npm
        run: npm install -g npm@12 --ignore-scripts

      - name: Publish package
        run: npm publish "$RUNNER_TEMP/release/package.tgz" --tag "$DIST_TAG" --access public --ignore-scripts

      - name: Summarize prerelease
        if: env.DIST_TAG != 'latest'
        run: |
          {
            echo "### Prerelease"
            echo ""
            echo "traQ revision: $TRAQ_REF"
            echo ""
            echo '```shell'
            echo "npm install --save-exact @traptitech/traq@$NEW_VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
